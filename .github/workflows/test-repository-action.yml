name: Test GitHub Profile Trophy Action
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: action-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-trophy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start local HTTPS GitHub fixture
        env:
          TROPHY_USERNAME: ${{ github.repository_owner }}
        shell: bash
        run: |
          fixture_dir="$RUNNER_TEMP/trophy-ci-tls"
          mkdir -p "$fixture_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$fixture_dir/ca.key" -out "$fixture_dir/ca.pem" \
            -subj "/CN=trophy-ci-ca" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" -addext "subjectKeyIdentifier=hash" \
            > /dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes -keyout "$fixture_dir/key.pem" \
            -out "$fixture_dir/request.csr" -subj "/CN=localhost" > /dev/null 2>&1
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid,issuer\n' > "$fixture_dir/extensions.cnf"
          openssl x509 -req -in "$fixture_dir/request.csr" -CA "$fixture_dir/ca.pem" \
            -CAkey "$fixture_dir/ca.key" -CAcreateserial -out "$fixture_dir/cert.pem" \
            -days 1 -extfile "$fixture_dir/extensions.cnf" > /dev/null 2>&1
          python3 .github/fixtures/github_api.py "$fixture_dir/cert.pem" "$fixture_dir/key.pem" "$TROPHY_USERNAME" \
            > "$RUNNER_TEMP/trophy-fixture.log" 2>&1 &
          printf 'TROPHY_FIXTURE_PID=%s\nDENO_CERT=%s\nGITHUB_API=https://127.0.0.1:8443/graphql\n' "$!" "$fixture_dir/ca.pem" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --silent --fail --cacert "$fixture_dir/ca.pem" https://127.0.0.1:8443/health > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          echo '::error::Local HTTPS fixture did not start.'
          exit 1

      - name: Generate trophy
        uses: ./.
        with:
          username: ${{ github.repository_owner }}
          output_path: ./trophy.svg
          token: fixture-token

      - name: Verify SVG generated
        run: |
          test -s trophy.svg
          file trophy.svg

      - name: Stop local fixture
        if: always()
        shell: bash
        run: |
          if [[ -n "${TROPHY_FIXTURE_PID:-}" ]]; then
            kill "$TROPHY_FIXTURE_PID" || true
          fi
