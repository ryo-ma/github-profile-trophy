name: Project checks and deployment

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Finish active production deployments in order; cancel superseded PR checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "1.44.4"

      - name: Verify dependencies
        run: |
          deno cache --lock=deno.lock deps.ts api/index.ts main.ts render_svg.ts
          git diff --exit-code -- deno.lock

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check entry points
        run: deno check --lock=deno.lock api/index.ts main.ts render_svg.ts

      - name: Test
        run: deno task test

  deploy:
    name: Deploy production to Vercel
    needs: checks
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || secrets.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - name: Validate deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          missing=0
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Add %s as a GitHub Actions repository variable or secret. See DEPLOYMENT.md.\n' "$name"
              missing=1
            fi
          done
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo '::error::Add VERCEL_TOKEN as a GitHub Actions repository secret, not a variable.'
            missing=1
          fi
          if [[ "$missing" != "0" ]]; then exit 1; fi
          case "$VERCEL_TOKEN" in
            github_pat_*|gh[pousr]_*)
              echo '::error::VERCEL_TOKEN must be a Vercel deployment token, not a GitHub token.'
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Vercel CLI
        run: npm install --global vercel@65.16.0

      - name: Pull production project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify required production settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          params = {"target": "production", "decrypt": "false"}
          if os.environ["VERCEL_ORG_ID"].startswith("team_"):
              params["teamId"] = os.environ["VERCEL_ORG_ID"]
          project = quote(os.environ["VERCEL_PROJECT_ID"], safe="")
          url = f"https://api.vercel.com/v10/projects/{project}/env?{urlencode(params)}"
          request = Request(url, headers={"Authorization": "Bearer " + os.environ["VERCEL_TOKEN"]})
          try:
              with urlopen(request, timeout=20) as response:
                  records = json.load(response)["envs"]
              keys = {record["key"] for record in records}
          except Exception:
              print("::error::Unable to inspect Vercel Production environment settings.")
              sys.exit(1)
          required = {"GITHUB_TOKEN1"}
          redis_settings = {"RATE_LIMIT_REDIS_URL", "RATE_LIMIT_REDIS_TOKEN"}
          if keys & redis_settings:
              required |= redis_settings
          missing = sorted(required - keys)
          for name in missing:
              print(f"::error::Set {name} in the Vercel project's Production environment before deploying.")
          sys.exit(bool(missing))
          PY

      - name: Deploy and build on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Remove downloaded environment files
        if: always()
        run: rm -rf -- .vercel
