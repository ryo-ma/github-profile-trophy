name: Generate GitHub Profile Trophy SVG
description: Run the local generator script to produce an SVG.
inputs:
  username:
    description: "GitHub username to generate the trophy for"
    required: true
  output_path:
    description: "Output path to write the SVG"
    required: true
    default: "trophy.svg"
  token:
    description: "PAT or token to use for GitHub API"
    required: true
    default: ${{ github.token }}
  theme:
    description: "Theme for the card"
    required: false
    default: "default"
  title:
    description: "Comma-separated list of trophy titles to display (e.g. 'Stars,Commits')"
    required: false
    default: ""
  column:
    description: "Maximum number of columns (-1 for auto)"
    required: false
    default: "-1"
  no_frame:
    description: "Disable trophy frame borders"
    required: false
    default: "false"
  no_bg:
    description: "Disable card background"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x

    - name: Generate trophy
      shell: bash
      env:
        GITHUB_TOKEN1: ${{ inputs.token }}
      run: |
        deno run --allow-net --allow-env --allow-read --allow-write $GITHUB_ACTION_PATH/render_svg.ts \
          "${{ inputs.username }}" \
          "${{ inputs.output_path }}" \
          "${{ inputs.theme }}" \
          "${{ inputs.title }}" \
          "${{ inputs.column }}" \
          "${{ inputs.no_frame }}" \
          "${{ inputs.no_bg }}"
